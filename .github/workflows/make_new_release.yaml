name: Multi Platform Build

on:
  workflow_dispatch:
    inputs:
      make_prerelease:
        description: Make it a pre-release
        type: string
        required: false
        default: 'true' # change back later (to false)
      bump_type:
        description: What to bump
        type: string
        required: false
        default: 'snapshot' # change back later (to 'm')

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.name }}
    #continue-on-error: true
    strategy:
      matrix:
        config:
          - { os: 'windows-latest',     name: 'Windows X64' }
          - { os: 'ubuntu-latest',      name: 'Ubuntu X64' }
          # I don't have the time for macos now. Not my platform. Maybe in the future.
          # - { os: 'macos-latest',       name: 'MacOS arm64' }
          # - { os: 'macos-latest-large', name: 'MacOS X64' } # Intel based are only large, and they are paid.
    steps:
      - name: Linux fix for SFML
        if: ${{ matrix.config.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          sudo apt install -y libxcursor-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libopengl-dev libogg-dev libvorbis-dev libflac-dev

      - name: Build
        uses: LunarisLib/actions/CMake@experimental
        with:
          artifact_name: ${{ matrix.config.os }}_PROJECT
          use_vcpkg: 'true'
          debug_everything: 'false'

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Versioning
        id: versioning
        uses: LunarisLib/actions/Versioning@master
        with:
          kind: ${{ inputs.bump_type }}
          project: VS_PROJECT # changing would break counting
          
      - name: Publish
        uses: LunarisLib/actions/Publisher@master
        with:
          title: "CMake Release"
          body: "This is a sample of a body to the example of a CMake project"
          tag_name: ${{ steps.versioning.outputs.version }}
          prerelease: ${{ inputs.make_prerelease }}

    