#      bump_type:
#        description: What to bump
#        type: string
#        required: false
#        default: 'snapshot' # change back later (to 'm')

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    steps:
      - name: Linux fix for SFML
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          sudo apt install -y libxcursor-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libopengl-dev libogg-dev libvorbis-dev

      - name: Build
        uses: LunarisLib/actions/CMake@experimental
        with:
          artifact_name: ${{ matrix.os }}_PROJECT
          use_vcpkg: 'true'
          debug_everything: 'false'

